name: ARC E0 full regression one-shot

on:
  pull_request:
    paths:
      - ".github/workflows/arc-e0-full-once.yml"

permissions:
  contents: read

jobs:
  all-public-environments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare official starter
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git /tmp/arc-starter
          git -C /tmp/arc-starter rev-parse HEAD | tee /tmp/starter-sha.txt
          cp agent/my_agent.py /tmp/arc-starter/agent/my_agent.py
          make -C /tmp/arc-starter setup PYTHON=python
      - name: Play all public environments
        working-directory: /tmp/arc-starter
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          .venv/bin/python scripts/play_local.py --max-steps 80 2>&1 | tee /tmp/e0-full.log
      - name: Validate full-run behavior
        run: python "$GITHUB_WORKSPACE/scripts/validate_e0_log.py" /tmp/e0-full.log

      - name: Preserve full-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-e0-full-one-shot
          path: |
            /tmp/e0-full.log
            /tmp/starter-sha.txt
          retention-days: 14
