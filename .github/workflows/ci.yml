name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest torch
      - name: Compile
        run: python -m compileall -q agent research tests
      - name: Test
        run: python -m pytest


  upstream-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current ARC runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "arc-agi>=0.9.6"
      - name: Verify ARC API assumptions
        run: |
          python - <<'PY'
          from arcengine import FrameData, GameAction

          assert GameAction.from_id(6) is GameAction.ACTION6
          assert GameAction.ACTION6.is_complex()
          assert GameAction.ACTION1.is_simple()

          frame = FrameData(
              levels_completed=0,
              available_actions=[1, 2, 6, 7],
              full_reset=False,
          )
          assert frame.available_actions == [1, 2, 6, 7]
          assert frame.full_reset is False
          PY
