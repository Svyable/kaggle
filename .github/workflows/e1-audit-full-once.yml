name: ARC E1 full artifact audit one-shot

on:
  pull_request:
    paths:
      - ".github/workflows/e1-audit-full-once.yml"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install E1 evaluation dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch

      - name: Download validated full public collection
        uses: actions/download-artifact@v4
        with:
          name: e1-full-public-trajectories
          path: /tmp/e1-full
          github-token: "${{ github.token }}"
          repository: Svyable/kaggle
          run-id: 35721678147

      - name: Run actual E1 loader and audit
        run: |
          python -m research.e1_evaluate \
            /tmp/e1-full/e1-public-full/transitions.jsonl \
            --validation-percent 20 \
            --split-seed arc3-systemone-v1 \
            --output /tmp/e1-full/e1-audit.json \
            | tee /tmp/e1-full/e1-audit.stdout

          python - <<'PY'
          import json
          from pathlib import Path
          from research.e1_dataset import load_transition_jsonl, split_by_family

          path = Path("/tmp/e1-full/e1-public-full/transitions.jsonl")
          transitions = load_transition_jsonl(path)
          train, validation = split_by_family(
              transitions,
              validation_percent=20,
              seed="arc3-systemone-v1",
          )
          train_families = {t.game_family for t in train}
          validation_families = {t.game_family for t in validation}
          assert len(transitions) == 2012
          assert train and validation
          assert train_families.isdisjoint(validation_families)
          assert train_families | validation_families == {
              t.game_family for t in transitions
          }
          print(
              f"E1 loader valid: {len(transitions)} transitions; "
              f"{len(train_families)} train families; "
              f"{len(validation_families)} validation families"
          )
          PY

      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-full-public-audit
          path: |
            /tmp/e1-full/e1-audit.json
            /tmp/e1-full/e1-audit.stdout
          if-no-files-found: warn
          retention-days: 14
