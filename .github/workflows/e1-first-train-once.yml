name: E1 first real training experiment

on:
  pull_request:
    paths:
      - ".github/workflows/e1-first-train-once.yml"

permissions:
  contents: read
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch

      - name: Download D0 full public trajectories
        uses: actions/download-artifact@v4
        with:
          name: e1-full-public-trajectories
          path: /tmp/e1-data
          github-token: "${{ github.token }}"
          repository: Svyable/kaggle
          run-id: 35721678147

      - name: Train E1 small grid-native dynamics model
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p /tmp/e1-run
          python -m research.e1_train \
            /tmp/e1-data/e1-public-full/transitions.jsonl \
            --output /tmp/e1-run/e1-small.pt \
            --epochs 6 \
            --batch-size 32 \
            --learning-rate 0.0003 \
            --weight-decay 0.0001 \
            --width 32 \
            --depth 2 \
            --cond-dim 64 \
            --seed 7 \
            --validation-percent 20 \
            --split-seed arc3-systemone-v1 \
            --device cpu \
            | tee /tmp/e1-run/train.stdout

      - name: Classify experiment against persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/e1-run/e1-small.pt.metrics.json")
          report = json.loads(path.read_text())
          model = report["best_model_validation"]
          persistence = report["persistence_validation"]

          changed_win = (
              model["changed_cell_accuracy"]
              > persistence["changed_cell_accuracy"]
          )
          exact_win = (
              model["exact_grid_accuracy"]
              > persistence["exact_grid_accuracy"]
          )
          cell_win = model["cell_accuracy"] > persistence["cell_accuracy"]

          decision = {
              "changed_cell_win": changed_win,
              "exact_grid_win": exact_win,
              "cell_win": cell_win,
              "model": model,
              "persistence": persistence,
              "provisional_e1_next_state_gate": changed_win and exact_win,
          }
          out = Path("/tmp/e1-run/decision.json")
          out.write_text(json.dumps(decision, indent=2, sort_keys=True) + "\n")
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY

      - name: Preserve E1 experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-first-real-train
          path: |
            /tmp/e1-run/
          if-no-files-found: warn
          retention-days: 14
