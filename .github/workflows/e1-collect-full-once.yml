name: ARC E1 full public collection one-shot

on:
  pull_request:
    paths:
      - ".github/workflows/e1-collect-full-once.yml"

permissions:
  contents: read

jobs:
  collect-all:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare official starter/runtime
        run: |
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Kaggle-Starter.git /tmp/arc-starter
          git -C /tmp/arc-starter rev-parse HEAD | tee /tmp/starter-sha.txt
          make -C /tmp/arc-starter setup PYTHON=python
          git -C /tmp/arc-starter/vendor/ARC-AGI-3-Agents rev-parse HEAD | tee /tmp/framework-sha.txt

      - name: Collect all public trajectories
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          /tmp/arc-starter/.venv/bin/python -m research.public_collector \
            --output-dir /tmp/e1-public-full \
            --agent-file "$GITHUB_WORKSPACE/agent/my_agent.py" \
            --framework-path /tmp/arc-starter/vendor/ARC-AGI-3-Agents \
            --max-steps 80 \
            --starter-sha "$(cat /tmp/starter-sha.txt)" \
            --framework-sha "$(cat /tmp/framework-sha.txt)" \
            | tee /tmp/e1-public-full.log

      - name: Validate full collection
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path("/tmp/e1-public-full")
          manifest = json.loads((root / "manifest.json").read_text())
          rows = [
              json.loads(line)
              for line in (root / "transitions.jsonl").read_text().splitlines()
              if line.strip()
          ]
          assert len(manifest["games"]) == 25
          assert manifest["total_transitions"] == len(rows) > 0
          families = Counter(row["game_family"] for row in rows)
          assert len(families) == 25
          assert all(count > 0 for count in families.values())
          for row in rows:
              assert 1 <= int(row["action_id"]) <= 7
              if row["action_id"] == 6:
                  assert 0 <= int(row["click_x"]) <= 63
                  assert 0 <= int(row["click_y"]) <= 63
              else:
                  assert row["click_x"] is None and row["click_y"] is None
          print(
              f"validated full collection: {len(rows)} transitions, "
              f"{len(families)} families, min rows/family={min(families.values())}"
          )
          PY

      - name: Preserve full collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-full-public-trajectories
          path: |
            /tmp/e1-public-full/
            /tmp/e1-public-full.log
            /tmp/starter-sha.txt
            /tmp/framework-sha.txt
          if-no-files-found: warn
          retention-days: 14
